[project]
name = "paideia-backend"
version = "0.1.0"
description = "Backend FastAPI para Paideia"
requires-python = ">=3.14,<3.15"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
