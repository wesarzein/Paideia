name: Backend CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: pip install -r backend/requirements.lock
      - name: Lint infrastructure and persistence changes
        run: ruff check scripts backend/app/core/config.py backend/app/seed_dev.py backend/app/import_roster.py backend/app/inspect_database.py backend/app/services/school_roster.py backend/migrations/env.py backend/tests/unit/test_roster_persistence.py backend/tests/unit/test_environment_config.py
      - name: Lint academic services and focused regressions
        working-directory: backend
        run: >-
          ruff check app/services/academic_access.py app/services/academic_metrics.py
          app/schemas/periods.py app/schemas/cohorts.py app/endpoints/cohorts.py
          tests/unit/test_academic_authorization.py tests/unit/test_grade_context_validation.py
          tests/unit/test_attendance_context_validation.py tests/unit/test_user_account_status.py
          tests/unit/test_academic_metrics.py tests/unit/test_grade_matrix_context.py
          tests/unit/test_academic_periods.py tests/unit/test_academic_cohorts.py
          tests/unit/test_enrollment_context.py tests/unit/test_follow_up_chronology.py
      - name: Lint business indicators and local experimental AI
        working-directory: backend
        run: >-
          ruff check app/services/business_metrics.py app/endpoints/kpis.py
          app/services/risk_features.py app/services/local_risk_model.py
          app/services/demonstration_dataset.py app/services/risk_registry.py
          app/services/demonstration_summary.py
          app/models/risk_model.py app/endpoints/risk_models.py app/ai_worker.py
          app/verify_risk_migration.py migrations/versions/0016_local_risk_models.py
          tests/unit/test_business_metrics.py tests/unit/test_risk_features.py
          tests/unit/test_local_risk_model.py tests/unit/test_risk_registry.py
      - name: Lint append-only academic audit and worker recovery
        working-directory: backend
        run: >-
          ruff check app/services/academic_audit.py app/models/academic_history.py
          app/endpoints/academic_history.py app/api/dependencies.py
          migrations/versions/0017_academic_change_history.py
          migrations/versions/0018_risk_worker_recovery.py
          tests/unit/test_academic_change_history.py tests/unit/test_risk_recovery.py
          tests/unit/test_clean_developer_start.py
      - name: Lint monthly provenance
        working-directory: backend
        run: >-
          ruff check app/services/grade_provenance.py
          app/services/student_names.py app/services/institutional_excel.py
          app/services/performance_forecast.py app/services/academic_metrics.py
          migrations/versions/0020_grade_provenance.py tests/unit/test_grade_provenance.py
      - run: docker compose --env-file .env.test.example -p paideia-synthetic-tests -f docker-compose.tests.yml build
      - run: docker compose --env-file .env.test.example -p paideia-synthetic-tests -f docker-compose.tests.yml run -T migrate
      - run: docker compose --env-file .env.test.example -p paideia-synthetic-tests -f docker-compose.tests.yml run -T tests
