name: Backend CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: pip install -r backend/requirements.lock
      - name: Lint infrastructure and persistence changes
        run: ruff check scripts backend/app/core/config.py backend/app/seed_dev.py backend/app/import_roster.py backend/app/inspect_database.py backend/app/services/school_roster.py backend/migrations/env.py backend/tests/unit/test_roster_persistence.py backend/tests/unit/test_environment_config.py
      - run: docker compose --env-file .env.test.example -p paideia-synthetic-tests -f docker-compose.tests.yml build
      - run: docker compose --env-file .env.test.example -p paideia-synthetic-tests -f docker-compose.tests.yml run -T migrate
      - run: docker compose --env-file .env.test.example -p paideia-synthetic-tests -f docker-compose.tests.yml run -T tests
